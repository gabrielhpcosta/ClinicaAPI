# PORTA (8080 estava ocupada por outro programa no PC)
server.port=8081


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DIALETO POSTGRES
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.expirationMs=3600000

logging.file.name=logs/api-clinica.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] [id = %X{id}] %logger{36} - %msg%n
logging.level.com.clinica.api=INFO